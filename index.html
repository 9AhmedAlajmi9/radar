<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flawless Radar Terminal</title>
<style>
:root{--bg:#0B0E14;--card:#121722;--line:#1e2636;--cy:#00F0FF;--gr:#00FF66;--pu:#B026FF;--rd:#FF4D6A;--tx:#E6EAF2;--mu:#8A94A8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.5}
button,input{font:inherit;color:inherit}
#splash{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
.radar{position:relative;width:220px;height:220px;border-radius:50%;border:1px solid var(--cy);box-shadow:0 0 40px rgba(0,240,255,.25);background:repeating-radial-gradient(circle,transparent 0 35px,rgba(0,240,255,.28) 36px 37px);margin-bottom:22px;overflow:hidden}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(0,240,255,0) 0 290deg,rgba(0,240,255,.6) 360deg);animation:spin 2s linear infinite}
.blip{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr)}
@keyframes spin{to{transform:rotate(360deg)}}
#splash h1{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:.14em;color:var(--cy);text-shadow:0 0 18px rgba(0,240,255,.5)}
#splash p{margin:0;color:var(--mu);font-size:14px}
#app{display:flex;min-height:100vh}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);z-index:10}
nav button{flex:1;background:none;border:0;padding:10px 4px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;cursor:pointer}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--cy);text-shadow:0 0 12px rgba(0,240,255,.6)}
nav button:focus-visible,.seg button:focus-visible,#langBtn:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
main{flex:1;min-width:0;padding:14px 14px 96px;max-width:980px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
header h2{margin:0;font-size:17px;color:var(--cy)}
#langBtn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sess{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sess .card{margin:0;padding:10px;font-size:12px}
.sess strong{display:block;font-size:14px}
.sess .o{border-color:rgba(0,255,102,.45)}.sess .o span{color:var(--gr)}
.sess span{color:var(--mu);font-variant-numeric:tabular-nums}
#kz{display:none;margin-bottom:12px;padding:8px 14px;border-radius:999px;background:rgba(0,255,102,.12);border:1px solid var(--gr);color:var(--gr);font-weight:700;text-align:center;box-shadow:0 0 22px rgba(0,255,102,.35);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 6px rgba(0,255,102,.2)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.px{display:flex;flex-direction:column;gap:4px;margin:0}
.px .top{display:flex;justify-content:space-between;align-items:center}
.px .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.px.up{animation:fu .7s}.px.down{animation:fd .7s}
@keyframes fu{0%{background:rgba(0,255,102,.28)}}
@keyframes fd{0%{background:rgba(255,77,106,.28)}}
.bd{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid}
.bd.l{color:var(--gr);border-color:var(--gr)}.bd.s{color:var(--pu);border-color:var(--pu)}
.ch{direction:ltr;text-align:start}.ch.p{color:var(--gr)}.ch.n{color:var(--rd)}
h3{margin:0 0 10px;font-size:15px}
.mu{color:var(--mu);font-size:13px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer}
.seg button.on{border-color:var(--cy);color:var(--cy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{appearance:none;width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--tx);transition:inset-inline-start .2s}
.sw:checked{background:var(--cy)}.sw:checked::after{inset-inline-start:23px;background:var(--bg)}
.sw:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--mu)}
label.f input{display:block;width:100%;margin-top:5px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;direction:ltr}
label.f input:focus{outline:2px solid var(--cy);border-color:transparent}
.warn{font-size:12px;color:var(--mu);border-inline-start:3px solid var(--pu);padding-inline-start:10px;margin:0 0 12px}
#clr{background:none;border:1px solid var(--rd);color:var(--rd);border-radius:8px;padding:9px 16px;cursor:pointer}
.foot{font-size:12px;color:var(--mu);text-align:center;margin-top:18px}
@media(min-width:768px){
 nav{position:sticky;top:0;height:100vh;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding-top:20px;border-top:0;border-inline-end:1px solid var(--line)}
 nav button{flex:none;padding:14px 4px}
 main{padding:24px}
}
@media(prefers-reduced-motion:reduce){.sweep,#kz{animation:none}}
</style>
</head>
<body>

<div id="splash">
 <div class="radar"><div class="sweep"></div>
  <i class="blip" style="top:48px;left:140px"></i><i class="blip" style="top:130px;left:70px;background:var(--pu);box-shadow:0 0 10px var(--pu)"></i><i class="blip" style="top:150px;left:150px"></i></div>
 <h1>FLAWLESS RADAR TERMINAL</h1>
 <p>المصمم: أحمد العجمي / Designed by: Ahmed Al-Ajmi</p>
</div>

<div id="app">
 <nav>
  <button data-t="radar" class="on"><b>◎</b><span data-i="tRadar"></span></button>
  <button data-t="paper"><b>▤</b><span data-i="tPaper"></span></button>
  <button data-t="hub"><b>⚙</b><span data-i="tHub"></span></button>
 </nav>
 <main>
  <header><h2 id="ttl"></h2><button id="langBtn"></button></header>

  <section class="tab on" id="radar">
   <div id="kz">KILL ZONE ACTIVE</div>
   <div class="sess" id="sess"></div>
   <h3 data-i="crypto"></h3>
   <div class="grid" id="cards"></div>
   <p class="mu" data-i="soon1"></p>
  </section>

  <section class="tab" id="paper">
   <div class="card"><h3 data-i="tPaper"></h3><p class="mu" data-i="soon2"></p></div>
  </section>

  <section class="tab" id="hub">
   <div class="card"><h3 data-i="dmode"></h3>
    <div class="seg" id="modeSeg"><button data-m="sim" data-i="sim"></button><button data-m="live" data-i="liveO"></button></div></div>
   <div class="card"><div class="row"><div><h3 style="margin:0" data-i="adapt"></h3><div class="mu" data-i="adaptD"></div><div class="mu" id="curInt"></div></div><input type="checkbox" class="sw" id="adapt" aria-label="adaptive"></div></div>
   <div class="card"><h3 data-i="keys"></h3><p class="warn" data-i="warn"></p>
    <label class="f">Google Gemini API Key<input type="password" id="k_gemini" autocomplete="off"></label>
    <label class="f">OpenAI API Key<input type="password" id="k_openai" autocomplete="off"></label>
    <label class="f">Twelve Data API Key <span data-i="opt"></span><input type="password" id="k_twelve" autocomplete="off"></label>
    <label class="f"><span data-i="platform"></span><input type="url" id="k_platform" placeholder="https://"></label>
    <button id="clr" data-i="clear"></button></div>
  </section>

  <p class="foot" data-i="disc"></p>
 </main>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

const L={
ar:{tRadar:"الرادار",tPaper:"المحاكي",tHub:"الإعدادات",crypto:"كريبتو",asia:"آسيا",london:"لندن",ny:"نيويورك",
 openIn:"مفتوحة · تغلق بعد",closedIn:"مغلقة · تفتح بعد",live:"مباشر",simb:"تجريبي",
 soon1:"الشارت ومحرك التحليل والإشارات يأتون في المرحلة الثانية. الذهب والأسهم تحتاج مفتاح Twelve Data.",
 soon2:"المحاكي والمساعد الذكي يأتيان في المرحلة الثانية.",
 dmode:"مصدر البيانات",sim:"محاكاة",liveO:"مباشر (Binance)",adapt:"السرعة التكيفية",
 adaptD:"3 ثوانٍ في منطقة السيولة، 5 عادي، 15 في الهدوء. عند الإيقاف: 5 ثوانٍ ثابتة.",cur:"التحديث الحالي كل",sec:"ثوانٍ",
 keys:"المفاتيح والمنصة",warn:"المفاتيح تُحفظ في هذا المتصفح فقط وغير مشفّرة. استخدم مفاتيح محدودة، وحدّد سقف صرف شهري من لوحة المزوّد.",
 opt:"(اختياري)",platform:"رابط منصة التداول الخاصة بك",clear:"حذف كل المفاتيح",
 disc:"أداة تحليل تعليمية وليست نصيحة مالية. الإشارات لا تضمن الربح."},
en:{tRadar:"Radar",tPaper:"Paper",tHub:"API Hub",crypto:"Crypto",asia:"Asia",london:"London",ny:"New York",
 openIn:"Open · closes in",closedIn:"Closed · opens in",live:"LIVE",simb:"SIMULATED",
 soon1:"Chart, analysis engine and signals arrive in Phase 2. Gold and stocks need a Twelve Data key.",
 soon2:"Paper trading and the AI co-pilot arrive in Phase 2.",
 dmode:"Data source",sim:"Simulation",liveO:"Live (Binance)",adapt:"Auto-Adaptive Speed",
 adaptD:"3s in the kill zone, 5s normal, 15s when quiet. When off: fixed 5s.",cur:"Refreshing every",sec:"s",
 keys:"Keys & platform",warn:"Keys are stored in this browser only, unencrypted. Use limited keys and set a monthly spend cap in the provider's dashboard.",
 opt:"(optional)",platform:"Your trading platform URL",clear:"Clear all keys",
 disc:"Educational analysis tool, not financial advice. Signals do not guarantee profit."}
};
let lang=get('lang','ar');

/* ---------- navigation ---------- */
$$('nav button').forEach(b=>b.onclick=()=>{
 $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
 $$('.tab').forEach(t=>t.classList.toggle('on',t.id===b.dataset.t));
 $('#ttl').textContent=b.querySelector('span').textContent;
});
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';set('lang',lang);applyLang()};

function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $$('[data-i]').forEach(e=>e.textContent=L[lang][e.dataset.i]);
 $('#langBtn').textContent=lang==='ar'?'EN':'عربي';
 $('#ttl').textContent=$('nav button.on span').textContent;
 renderSessions();renderCards();showInt();
}

/* ---------- sessions ---------- */
const SES=[['asia',0,9],['london',7,16],['ny',12,21]];
const hUTC=()=>{const n=new Date();return n.getUTCHours()+n.getUTCMinutes()/60+n.getUTCSeconds()/3600};
const hms=h=>{let s=Math.round(h*3600);const p=x=>String(x).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
function renderSessions(){
 const h=hUTC();
 $('#sess').innerHTML=SES.map(([k,s,e])=>{
  const open=h>=s&&h<e,t=open?e:(h<s?s:s+24);
  return `<div class="card ${open?'o':''}"><strong>${L[lang][k]}</strong><span>${L[lang][open?'openIn':'closedIn']}<br>${hms(t-h)}</span></div>`}).join('');
 $('#kz').style.display=(h>=12&&h<16)?'block':'none';
}
setInterval(renderSessions,1000);

/* ---------- data layer ---------- */
const SYMS=[['BTCUSDT','BTC'],['ETHUSDT','ETH'],['SOLUSDT','SOL']];
const base={BTCUSDT:68000,ETHUSDT:3500,SOLUSDT:160};
const px={};SYMS.forEach(([s])=>px[s]={p:base[s],o:base[s],prev:base[s],live:false});

function renderCards(){
 $('#cards').innerHTML=SYMS.map(([s,n])=>{
  const o=px[s],chg=(o.p/o.o-1)*100,dir=o.p>o.prev?'up':o.p<o.prev?'down':'';
  return `<div class="card px ${dir}"><div class="top"><strong>${n}/USDT</strong><span class="bd ${o.live?'l':'s'}">${L[lang][o.live?'live':'simb']}</span></div>
  <div class="v">${o.p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
  <div class="ch ${chg>=0?'p':'n'}">${chg>=0?'+':''}${chg.toFixed(2)}%</div></div>`}).join('');
}

async function update(){
 if(get('mode','live')==='live'){
  try{
   const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(SYMS.map(x=>x[0]))));
   if(!r.ok)throw 0;
   (await r.json()).forEach(x=>{const o=px[x.symbol];o.prev=o.p;o.p=+x.lastPrice;o.o=+x.openPrice;o.live=true});
   renderCards();return;
  }catch(e){}
 }
 SYMS.forEach(([s])=>{const o=px[s];o.prev=o.p;o.p*=1+(Math.random()-.5)*.002;o.live=false});
 renderCards();
}
function interval(){
 if(get('adapt','1')!=='1')return 5000;
 const h=hUTC();return(h>=12&&h<16)?3000:(h>=7&&h<21)?5000:15000;
}
function showInt(){$('#curInt').textContent=L[lang].cur+' '+interval()/1000+' '+L[lang].sec}
(async function loop(){await update();showInt();setTimeout(loop,interval())})();

/* ---------- API Hub ---------- */
function paintMode(){$$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===get('mode','live')))}
$$('#modeSeg button').forEach(b=>b.onclick=()=>{set('mode',b.dataset.m);paintMode();update()});
$('#adapt').checked=get('adapt','1')==='1';
$('#adapt').onchange=e=>{set('adapt',e.target.checked?'1':'0');showInt()};
['k_gemini','k_openai','k_twelve','k_platform'].forEach(id=>{const el=$('#'+id);el.value=get(id,'');el.oninput=()=>set(id,el.value.trim())});
$('#clr').onclick=()=>['k_gemini','k_openai','k_twelve','k_platform'].forEach(id=>{$('#'+id).value='';set(id,'')});
paintMode();applyLang();

/* ---------- splash ---------- */
setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),700)},3000);
</script>
</body>
</html>
